services:
  - type: web
    name: inkpad
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
    # The free plan has no persistent disk, so the SQLite file is recreated
    # (with the demo accounts) when the instance restarts. To keep data, move
    # to a paid plan, add a disk, and point DATA_DIR at its mount path. See
    # "Deployment" in the README.
